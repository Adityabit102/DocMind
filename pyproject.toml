[project]
name = "docmind"
version = "1.0.0"
description = "AI-Powered RAG Document Q&A System"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app", "rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data", "logs", "evaluation/results", "evaluation/testsets"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4"]
ignore = ["E501", "B008"]  # E501: line length handled by black; B008: FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["frontend/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
